<body>

<!-- ========================================
     页面结构
     ======================================== -->

<!-- 顶部导航栏 -->
<header class="site-header">
  <a href="#" class="site-logo" onclick="location.reload();return false;">Chromasense<span>.</span></a>
  <span class="site-subtitle">图片色彩提取与配色参考</span>
</header>

<!-- ========================================
     上传页面 - 拖拽/点击/粘贴上传图片
     ======================================== -->
<section class="upload-section" id="uploadSection">
  <div class="upload-bg-orb orb-1"></div>
  <div class="upload-bg-orb orb-2"></div>
  <div class="upload-bg-orb orb-3"></div>
  <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="点击或拖拽上传图片">
    <div class="upload-icon"><i class="fas fa-eye-dropper"></i></div>
    <h1 class="upload-title">拖入图片，解读色彩</h1>
    <p class="upload-desc">
      将图片拖拽到此处，或点击选择文件<br>
      也可以按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴剪贴板中的图片
    </p>
    <div class="upload-formats">
      <span>JPG</span><span>PNG</span><span>WEBP</span><span>BMP</span><span>GIF</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
  </div>
</section>

<!-- ========================================
     结果页面 - 色彩分析结果展示
     ======================================== -->
<section class="result-section" id="resultSection">
  <!-- 工具栏：提取数量、排序、重新上传 -->
  <div class="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-label">提取数量</span>
      <input type="range" class="toolbar-slider" id="countSlider" min="4" max="20" value="10">
      <span class="toolbar-count" id="countDisplay">10</span>
    </div>
    <div class="toolbar-group">
      <span class="toolbar-label">排序</span>
      <select class="toolbar-select" id="sortSelect">
        <option value="pct">按占比</option>
        <option value="hue">按色相</option>
        <option value="lum">按明度</option>
      </select>
    </div>
    <div class="toolbar-spacer"></div>
    <button class="toolbar-btn primary" id="generatePaletteBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      生成配色卡
    </button>
    <button class="toolbar-btn" id="reuploadBtn"><i class="fas fa-redo"></i> 重新上传</button>
  </div>

  <!-- 分析网格：左侧图片面板 + 右侧色板面板 -->
  <div class="analysis-grid">
    <div class="image-panel">
      <div class="image-tabs">
        <button class="image-tab active" data-tab="original">原图</button>
        <button class="image-tab" data-tab="simplified">色彩简化</button>
      </div>
      <div class="image-display">
        <canvas id="displayCanvas"></canvas>
      </div>
      <div class="image-meta" id="imageMeta"></div>
    </div>
    <!-- 右侧：提取的色板列表 -->
    <div class="palette-panel">
      <div class="palette-header">提取色板</div>
      <div class="color-strip-wrap">
        <div class="color-strip" id="colorStrip"></div>
      </div>
      <div class="color-list" id="colorList"></div>
    </div>
  </div>

  <!-- 配色预览 -->
  <h2 class="section-title">配色效果预览</h2>
  <p class="section-desc">用提取的色彩渲染一组真实 UI 组件，直观感受配色的实际表现</p>
  <div class="preview-box">
    <div class="preview-frame" id="previewFrame"></div>
  </div>

  <!-- CSS 导出 -->
  <h2 class="section-title">CSS 变量导出</h2>
  <p class="section-desc">一键复制，直接应用到你的项目中</p>
  <div class="export-box">
    <div class="export-header">
      <div class="export-header-left">
        <span class="export-header-title">:root 变量</span>
        <span class="export-header-hint">包含色值、色名、占比注释</span>
      </div>
      <button class="export-copy-btn" id="exportCopyBtn"><i class="fas fa-copy"></i> 复制代码</button>
    </div>
    <pre class="export-code" id="exportCode"></pre>
  </div>
</section>

<!-- 隐藏画布：用于像素采样和色彩简化处理 -->
<canvas class="hidden-canvas" id="sampleCanvas"></canvas>
<canvas class="hidden-canvas" id="simplifyCanvas"></canvas>

<!-- Toast 通知容器 -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</html>
